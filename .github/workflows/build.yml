name: Build Merish Engine APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Merish App
        run: |
          # 1. Clean workspace completely
          cd /tmp
          flutter create --org com.merish.player --project-name merish merish_app
          cd merish_app

          # 2. Add dependencies cleanly
          flutter pub add media_kit
          flutter pub add media_kit_video
          flutter pub add media_kit_libs_android_video
          flutter pub add permission_handler

          # 3. Patch minSdkVersion to 21 (strictly required by media_kit/libmpv)
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle

          # 4. Inject Core Player Code
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:media_kit/media_kit.dart';
          import 'package:media_kit_video/media_kit_video.dart';
          import 'package:permission_handler/permission_handler.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            MediaKit.ensureInitialized();
            await SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
            runApp(const MerishPlayerApp());
          }

          class MerishPlayerApp extends StatelessWidget {
            const MerishPlayerApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Merish',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: Colors.black,
                  colorScheme: const ColorScheme.dark(
                    primary: Colors.amber,
                    surface: Colors.black,
                  ),
                ),
                home: const VideoPlayerScreen(),
              );
            }
          }

          class VideoPlayerScreen extends StatefulWidget {
            const VideoPlayerScreen({super.key});

            @override
            State<VideoPlayerScreen> createState() => _VideoPlayerScreenState();
          }

          class _VideoPlayerScreenState extends State<VideoPlayerScreen> {
            late final Player player;
            late final VideoController controller;
            bool isReady = false;

            @override
            void initState() {
              super.initState();
              initEngine();
            }

            Future<void> initEngine() async {
              await Permission.storage.request();
              await Permission.videos.request();

              player = Player(
                configuration: const PlayerConfiguration(
                  bufferSize: 32 * 1024 * 1024,
                  logLevel: LogLevel.none,
                ),
              );

              controller = VideoController(
                player,
                configuration: const VideoControllerConfiguration(
                  enableHardwareAcceleration: true,
                  hwdec: 'mediacodec',
                ),
              );

              if (mounted) {
                setState(() {
                  isReady = true;
                });
              }
            }

            @override
            void dispose() {
              player.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              if (!isReady) {
                return const Scaffold(
                  backgroundColor: Colors.black,
                  body: Center(
                    child: CircularProgressIndicator(
                      color: Colors.amber,
                      strokeWidth: 2.5,
                    ),
                  ),
                );
              }

              return Scaffold(
                backgroundColor: Colors.black,
                body: Center(
                  child: Video(
                    controller: controller,
                    controls: AdaptiveVideoControls,
                  ),
                ),
              );
            }
          }
          EOF

          # 5. Add Hardware Acceleration & Permissions
          sed -i '/<application/a \        android:hardwareAccelerated="true"' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />' android/app/src/main/AndroidManifest.xml

          # 6. Build Snapdragon ARM64 APK
          flutter build apk --split-per-abi --release

          # 7. Collect APK to repository artifact folder
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk $GITHUB_WORKSPACE/output/merish-arm64-v8a.apk

      - name: Upload Merish APK
        uses: actions/upload-artifact@v4
        with:
          name: Merish-Engine-ARM64
          path: output/merish-arm64-v8a.apk
