name: Build Merish Engine APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Repair Project Scaffolding
        run: |
          # Backup our custom files
          cp lib/main.dart /tmp/main.dart.bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak

          # Generate official Android skeleton cleanly
          flutter create --org com.merish.player --project-name merish .

          # Restore our custom engine files
          cp /tmp/main.dart.bak lib/main.dart
          cp /tmp/pubspec.yaml.bak pubspec.yaml

          # Configure Android 64-bit target & MediaCodec
          flutter pub get

      - name: Build Merish ARM64 APK
        run: flutter build apk --split-per-abi --release

      - name: Upload Merish APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Merish-Engine-ARM64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
