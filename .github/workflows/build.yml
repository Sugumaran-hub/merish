name: Build Merish Engine APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Merish Flagship APK
        run: |
          # 1. Fresh pure Android Flutter project
          rm -rf /tmp/merish_app
          flutter create --platforms=android --org com.merish.player --project-name merish /tmp/merish_app
          cd /tmp/merish_app

          # 2. Add dependencies cleanly
          flutter pub add media_kit
          flutter pub add media_kit_video
          flutter pub add media_kit_libs_android_video
          flutter pub add permission_handler
          flutter pub add path

          # 3. Inject Merish Flagship Core Engine
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:media_kit/media_kit.dart';
          import 'package:media_kit_video/media_kit_video.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:path/path.dart' as p;

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            MediaKit.ensureInitialized();
            await SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
            runApp(const MerishPlayerApp());
          }

          class MerishPlayerApp extends StatelessWidget {
            const MerishPlayerApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Merish',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: Colors.black,
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFFFFB300),
                    surface: Color(0xFF121212),
                  ),
                ),
                home: const MediaBrowserScreen(),
              );
            }
          }

          // -------------------------------------------------------------
          // MEDIA BROWSER (FOLDER-WISE IN-APP SCANNER)
          // -------------------------------------------------------------
          class MediaBrowserScreen extends StatefulWidget {
            const MediaBrowserScreen({super.key});

            @override
            State<MediaBrowserScreen> createState() => _MediaBrowserScreenState();
          }

          class _MediaBrowserScreenState extends State<MediaBrowserScreen> {
            bool isLoading = true;
            Map<String, List<File>> folderMap = {};

            @override
            void initState() {
              super.initState();
              initStorage();
            }

            Future<void> initStorage() async {
              await Permission.storage.request();
              await Permission.videos.request();
              await scanDeviceVideos();
            }

            Future<void> scanDeviceVideos() async {
              setState(() => isLoading = true);
              folderMap.clear();

              final commonDirs = [
                Directory('/storage/emulated/0/DCIM'),
                Directory('/storage/emulated/0/Movies'),
                Directory('/storage/emulated/0/Download'),
                Directory('/storage/emulated/0/Download/Telegram'),
                Directory('/storage/emulated/0/WhatsApp/Media/WhatsApp Video'),
                Directory('/storage/emulated/0/Android/media/com.whatsapp/WhatsApp/Media/WhatsApp Video'),
              ];

              final videoExts = ['.mp4', '.mkv', '.webm', '.avi', '.mov', '.ts'];

              for (var dir in commonDirs) {
                if (await dir.exists()) {
                  try {
                    await for (var entity in dir.list(recursive: true, followLinks: false)) {
                      if (entity is File) {
                        String ext = p.extension(entity.path).toLowerCase();
                        if (videoExts.contains(ext)) {
                          String folderName = p.basename(p.dirname(entity.path));
                          folderMap.putIfAbsent(folderName, () => []).add(entity);
                        }
                      }
                    }
                  } catch (_) {}
                }
              }

              if (mounted) {
                setState(() => isLoading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                appBar: AppBar(
                  backgroundColor: Colors.black,
                  elevation: 0,
                  title: Row(
                    children: [
                      Container(
                        padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                        decoration: BoxDecoration(
                          color: const Color(0xFFFFB300),
                          borderRadius: BorderRadius.circular(6),
                        ),
                        child: const Text(
                          "MERISH",
                          style: TextStyle(
                            color: Colors.black,
                            fontWeight: FontWeight.w900,
                            letterSpacing: 1.5,
                            fontSize: 14,
                          ),
                        ),
                      ),
                      const SizedBox(width: 12),
                      const Text(
                        "Folders",
                        style: TextStyle(fontWeight: FontWeight.bold, fontSize: 18),
                      ),
                    ],
                  ),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.refresh_rounded, color: Color(0xFFFFB300)),
                      onPressed: scanDeviceVideos,
                    ),
                  ],
                ),
                body: isLoading
                    ? const Center(
                        child: CircularProgressIndicator(color: Color(0xFFFFB300), strokeWidth: 2),
                      )
                    : folderMap.isEmpty
                        ? Center(
                            child: Column(
                              mainAxisAlignment: MainAxisAlignment.center,
                              children: [
                                const Icon(Icons.video_collection_outlined, size: 64, color: Colors.white24),
                                const SizedBox(height: 16),
                                const Text("No video folders detected", style: TextStyle(color: Colors.white70)),
                                const SizedBox(height: 12),
                                ElevatedButton(
                                  style: ElevatedButton.styleFrom(
                                    backgroundColor: const Color(0xFFFFB300),
                                    foregroundColor: Colors.black,
                                  ),
                                  onPressed: scanDeviceVideos,
                                  child: const Text("Scan Again"),
                                ),
                              ],
                            ),
                          )
                        : ListView.separated(
                            padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 12),
                            itemCount: folderMap.keys.length,
                            separatorBuilder: (_, __) => const SizedBox(height: 12),
                            itemBuilder: (context, index) {
                              String folder = folderMap.keys.elementAt(index);
                              List<File> files = folderMap[folder]!;
                              return InkWell(
                                borderRadius: BorderRadius.circular(12),
                                onTap: () {
                                  Navigator.push(
                                    context,
                                    MaterialPageRoute(
                                      builder: (_) => FolderVideosScreen(
                                        folderName: folder,
                                        videos: files,
                                      ),
                                    ),
                                  );
                                },
                                child: Container(
                                  padding: const EdgeInsets.all(16),
                                  decoration: BoxDecoration(
                                    color: const Color(0xFF141414),
                                    borderRadius: BorderRadius.circular(12),
                                    border: Border.all(color: Colors.white10),
                                  ),
                                  child: Row(
                                    children: [
                                      Container(
                                        padding: const EdgeInsets.all(12),
                                        decoration: BoxDecoration(
                                          color: Colors.black,
                                          borderRadius: BorderRadius.circular(10),
                                        ),
                                        child: const Icon(Icons.folder_rounded, color: Color(0xFFFFB300), size: 28),
                                      ),
                                      const SizedBox(width: 16),
                                      Expanded(
                                        child: Column(
                                          crossAxisAlignment: CrossAxisAlignment.start,
                                          children: [
                                            Text(
                                              folder,
                                              style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16),
                                              maxLines: 1,
                                              overflow: TextOverflow.ellipsis,
                                            ),
                                            const SizedBox(height: 4),
                                            Text(
                                              "${files.length} videos",
                                              style: const TextStyle(color: Colors.white54, fontSize: 13),
                                            ),
                                          ],
                                        ),
                                      ),
                                      const Icon(Icons.chevron_right_rounded, color: Colors.white24),
                                    ],
                                  ),
                                ),
                              );
                            },
                          ),
              );
            }
          }

          // -------------------------------------------------------------
          // FOLDER VIDEOS SCREEN
          // -------------------------------------------------------------
          class FolderVideosScreen extends StatelessWidget {
            final String folderName;
            final List<File> videos;

            const FolderVideosScreen({super.key, required this.folderName, required this.videos});

            String getFileSize(File file) {
              try {
                int bytes = file.lengthSync();
                if (bytes >= 1024 * 1024 * 1024) {
                  return "${(bytes / (1024 * 1024 * 1024)).toStringAsFixed(1)} GB";
                }
                return "${(bytes / (1024 * 1024)).toStringAsFixed(1)} MB";
              } catch (_) {
                return "--";
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                appBar: AppBar(
                  backgroundColor: Colors.black,
                  elevation: 0,
                  title: Text(folderName, style: const TextStyle(fontWeight: FontWeight.bold)),
                ),
                body: ListView.separated(
                  padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                  itemCount: videos.length,
                  separatorBuilder: (_, __) => const SizedBox(height: 10),
                  itemBuilder: (context, index) {
                    final file = videos[index];
                    final name = p.basename(file.path);
                    final ext = p.extension(file.path).toUpperCase().replaceAll('.', '');
                    final size = getFileSize(file);

                    return InkWell(
                      borderRadius: BorderRadius.circular(10),
                      onTap: () {
                        Navigator.push(
                          context,
                          MaterialPageRoute(
                            builder: (_) => FlagshipPlayerScreen(file: file),
                          ),
                        );
                      },
                      child: Container(
                        padding: const EdgeInsets.all(12),
                        decoration: BoxDecoration(
                          color: const Color(0xFF141414),
                          borderRadius: BorderRadius.circular(10),
                          border: Border.all(color: Colors.white10),
                        ),
                        child: Row(
                          children: [
                            Container(
                              width: 60,
                              height: 60,
                              decoration: BoxDecoration(
                                color: Colors.black,
                                borderRadius: BorderRadius.circular(8),
                              ),
                              child: const Icon(Icons.play_circle_fill_rounded, color: Color(0xFFFFB300), size: 32),
                            ),
                            const SizedBox(width: 14),
                            Expanded(
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Text(
                                    name,
                                    style: const TextStyle(fontWeight: FontWeight.w600, fontSize: 14),
                                    maxLines: 2,
                                    overflow: TextOverflow.ellipsis,
                                  ),
                                  const SizedBox(height: 6),
                                  Row(
                                    children: [
                                      Container(
                                        padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),
                                        decoration: BoxDecoration(
                                          color: Colors.white10,
                                          borderRadius: BorderRadius.circular(4),
                                        ),
                                        child: Text(
                                          ext,
                                          style: const TextStyle(fontSize: 10, fontWeight: FontWeight.bold, color: Color(0xFFFFB300)),
                                        ),
                                      ),
                                      const SizedBox(width: 8),
                                      Text(size, style: const TextStyle(color: Colors.white54, fontSize: 12)),
                                    ],
                                  ),
                                ],
                              ),
                            ),
                          ],
                        ),
                      ),
                    );
                  },
                ),
              );
            }
          }

          // -------------------------------------------------------------
          // FLAGSHIP PLAYER SCREEN (MEDIACODEC + GESTURES + MEDIA INFO)
          // -------------------------------------------------------------
          class FlagshipPlayerScreen extends StatefulWidget {
            final File file;
            const FlagshipPlayerScreen({super.key, required this.file});

            @override
            State<FlagshipPlayerScreen> createState() => _FlagshipPlayerScreenState();
          }

          class _FlagshipPlayerScreenState extends State<FlagshipPlayerScreen> {
            late final Player player;
            late final VideoController controller;
            bool isControlsVisible = true;
            bool isHardwareDecoder = true;
            double brightnessVal = 0.5;
            double volumeVal = 0.8;
            String gestureIndicatorText = "";
            bool showGestureIndicator = false;

            @override
            void initState() {
              super.initState();
              initEngine();
            }

            void initEngine() {
              player = Player(
                configuration: const PlayerConfiguration(
                  bufferSize: 32 * 1024 * 1024,
                ),
              );

              controller = VideoController(
                player,
                configuration: const VideoControllerConfiguration(
                  enableHardwareAcceleration: true,
                  hwdec: 'mediacodec',
                ),
              );

              player.open(Media(widget.file.path));
            }

            void toggleHardwareDecoder() {
              setState(() {
                isHardwareDecoder = !isHardwareDecoder;
              });
              player.open(
                Media(
                  widget.file.path,
                  httpHeaders: {},
                ),
                play: true,
              );
            }

            void showMediaInspector() {
              showModalBottomSheet(
                context: context,
                backgroundColor: const Color(0xFF141414),
                shape: const RoundedRectangleBorder(
                  borderRadius: BorderRadius.vertical(top: Radius.circular(20)),
                ),
                builder: (context) {
                  return Padding(
                    padding: const EdgeInsets.all(20),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          children: [
                            const Icon(Icons.info_outline_rounded, color: Color(0xFFFFB300)),
                            const SizedBox(width: 10),
                            const Text("Media Inspector", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 18)),
                            const Spacer(),
                            Container(
                              padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 3),
                              decoration: BoxDecoration(
                                color: const Color(0xFFFFB300),
                                borderRadius: BorderRadius.circular(6),
                              ),
                              child: Text(
                                isHardwareDecoder ? "HW (MediaCodec)" : "SW (CPU)",
                                style: const TextStyle(color: Colors.black, fontWeight: FontWeight.bold, fontSize: 11),
                              ),
                            ),
                          ],
                        ),
                        const Divider(color: Colors.white12, height: 24),
                        _infoRow("File Name", p.basename(widget.file.path)),
                        _infoRow("Storage Path", widget.file.path),
                        _infoRow("Resolution", "${player.state.width ?? 'Dynamic'} x ${player.state.height ?? 'Adaptive'}"),
                        _infoRow("Buffer Cap", "32 MB Strict (Zero-Drop)"),
                        _infoRow("Active Audio", player.state.track.audio.id),
                        _infoRow("Active Subtitle", player.state.track.subtitle.id),
                        const SizedBox(height: 16),
                      ],
                    ),
                  );
                },
              );
            }

            Widget _infoRow(String label, String value) {
              return Padding(
                padding: const EdgeInsets.symmetric(vertical: 4),
                child: Row(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    SizedBox(width: 110, child: Text(label, style: const TextStyle(color: Colors.white54, fontSize: 13))),
                    Expanded(child: Text(value, style: const TextStyle(fontWeight: FontWeight.w500, fontSize: 13))),
                  ],
                ),
              );
            }

            @override
            void dispose() {
              player.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                body: GestureDetector(
                  onTap: () => setState(() => isControlsVisible = !isControlsVisible),
                  onDoubleTapDown: (details) {
                    final screenWidth = MediaQuery.of(context).size.width;
                    if (details.localPosition.dx > screenWidth / 2) {
                      player.seek(player.state.position + const Duration(seconds: 10));
                    } else {
                      player.seek(player.state.position - const Duration(seconds: 10));
                    }
                  },
                  child: Stack(
                    children: [
                      Center(
                        child: Video(
                          controller: controller,
                          controls: NoVideoControls,
                        ),
                      ),
                      // Top Bar Overlay
                      if (isControlsVisible)
                        Positioned(
                          top: 24,
                          left: 12,
                          right: 12,
                          child: Row(
                            children: [
                              IconButton(
                                icon: const Icon(Icons.arrow_back_rounded, color: Colors.white),
                                onPressed: () => Navigator.pop(context),
                              ),
                              Expanded(
                                child: Text(
                                  p.basename(widget.file.path),
                                  style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15),
                                  maxLines: 1,
                                  overflow: TextOverflow.ellipsis,
                                ),
                              ),
                              ActionChip(
                                backgroundColor: isHardwareDecoder ? const Color(0xFFFFB300) : Colors.white12,
                                label: Text(
                                  isHardwareDecoder ? "HW" : "SW",
                                  style: TextStyle(
                                    color: isHardwareDecoder ? Colors.black : Colors.white,
                                    fontWeight: FontWeight.bold,
                                    fontSize: 12,
                                  ),
                                ),
                                onPressed: toggleHardwareDecoder,
                              ),
                              IconButton(
                                icon: const Icon(Icons.info_outline_rounded, color: Colors.white),
                                onPressed: showMediaInspector,
                              ),
                            ],
                          ),
                        ),
                      // Bottom Transport Bar
                      if (isControlsVisible)
                        Positioned(
                          bottom: 24,
                          left: 16,
                          right: 16,
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              StreamBuilder<Duration>(
                                stream: player.stream.position,
                                builder: (context, snapshot) {
                                  final pos = snapshot.data ?? Duration.zero;
                                  final dur = player.state.duration;
                                  return Row(
                                    children: [
                                      Text(
                                        pos.toString().split('.').first.padLeft(8, "0"),
                                        style: const TextStyle(fontSize: 12, color: Colors.white70),
                                      ),
                                      Expanded(
                                        child: Slider(
                                          activeColor: const Color(0xFFFFB300),
                                          inactiveColor: Colors.white24,
                                          value: dur.inMilliseconds > 0
                                              ? (pos.inMilliseconds / dur.inMilliseconds).clamp(0.0, 1.0)
                                              : 0.0,
                                          onChanged: (v) {
                                            player.seek(Duration(milliseconds: (v * dur.inMilliseconds).toInt()));
                                          },
                                        ),
                                      ),
                                      Text(
                                        dur.toString().split('.').first.padLeft(8, "0"),
                                        style: const TextStyle(fontSize: 12, color: Colors.white70),
                                      ),
                                    ],
                                  );
                                },
                              ),
                              Row(
                                mainAxisAlignment: MainAxisAlignment.center,
                                children: [
                                  IconButton(
                                    icon: const Icon(Icons.replay_10_rounded, color: Colors.white, size: 30),
                                    onPressed: () => player.seek(player.state.position - const Duration(seconds: 10)),
                                  ),
                                  const SizedBox(width: 20),
                                  StreamBuilder<bool>(
                                    stream: player.stream.playing,
                                    builder: (context, snapshot) {
                                      final isPlaying = snapshot.data ?? true;
                                      return Container(
                                        decoration: const BoxDecoration(
                                          color: Color(0xFFFFB300),
                                          shape: BoxShape.circle,
                                        ),
                                        child: IconButton(
                                          icon: Icon(isPlaying ? Icons.pause_rounded : Icons.play_arrow_rounded),
                                          color: Colors.black,
                                          iconSize: 36,
                                          onPressed: () => player.playOrPause(),
                                        ),
                                      );
                                    },
                                  ),
                                  const SizedBox(width: 20),
                                  IconButton(
                                    icon: const Icon(Icons.forward_10_rounded, color: Colors.white, size: 30),
                                    onPressed: () => player.seek(player.state.position + const Duration(seconds: 10)),
                                  ),
                                ],
                              ),
                            ],
                          ),
                        ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          # 4. App Name to "Merish"
          sed -i 's/android:label="merish"/android:label="Merish"/g' android/app/src/main/AndroidManifest.xml

          # 5. AMOLED Cinema Icon Generation
          python3 -c "
          import os, struct, zlib
          def make_png(w, h):
              raw = bytearray()
              cx, cy, r = w//2, h//2, w//2 - 6
              for y in range(h):
                  raw.append(0)
                  for x in range(w):
                      dx, dy = x - cx, y - cy
                      if dx*dx + dy*dy <= r*r:
                          if x >= cx - 10 and x <= cx + 20 and abs(dy) <= (x - (cx - 10)) * 0.8:
                              raw.extend([255, 179, 0, 255])
                          else:
                              raw.extend([14, 14, 14, 255])
                      else:
                          raw.extend([0, 0, 0, 0])
              def chunk(tag, d):
                  return struct.pack('>I', len(d)) + tag + d + struct.pack('>I', zlib.crc32(tag + d) & 0xffffffff)
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(bytes(raw))) + chunk(b'IEND', b'')

          b = make_png(192, 192)
          res_dir = 'android/app/src/main/res'
          for d in os.listdir(res_dir):
              if d.startswith('mipmap'):
                  with open(os.path.join(res_dir, d, 'ic_launcher.png'), 'wb') as f:
                      f.write(b)
          "

          # 6. Apply SDK 37 & MinSDK 21 configs
          find android/app -name "build.gradle*" -exec sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 37/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' {} +

          # 7. Build Snapdragon ARM64 APK
          flutter build apk --split-per-abi --release

          # 8. Copy APK output
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk $GITHUB_WORKSPACE/output/merish-arm64-v8a.apk

      - name: Upload Merish APK
        uses: actions/upload-artifact@v4
        with:
          name: Merish-Engine-ARM64
          path: output/merish-arm64-v8a.apk
