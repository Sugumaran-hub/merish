name: Build Merish Engine APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Merish Master Flagship APK
        run: |
          rm -rf /tmp/merish_app
          flutter create --platforms=android --org com.merish.player --project-name merish /tmp/merish_app
          cd /tmp/merish_app

          # Dependencies
          flutter pub add media_kit
          flutter pub add media_kit_video
          flutter pub add media_kit_libs_android_video
          flutter pub add permission_handler
          flutter pub add path
          flutter pub add shared_preferences

          # 1. Native Kotlin Bridge (Zero-Crash Thumbnails + System Volume/Brightness Sync)
          cat << 'EOF' > android/app/src/main/kotlin/com/merish/player/merish/MainActivity.kt
          package com.merish.player.merish

          import android.content.Context
          import android.graphics.Bitmap
          import android.media.MediaMetadataRetriever
          import android.media.AudioManager
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.merish.player/native"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "getThumbnail" -> {
                              val videoPath = call.argument<String>("path")
                              if (videoPath == null) {
                                  result.success(null)
                                  return@setMethodCallHandler
                              }
                              Thread {
                                  try {
                                      val cacheFile = File(cacheDir, "thumb_" + videoPath.hashCode() + ".jpg")
                                      if (cacheFile.exists() && cacheFile.length() > 0) {
                                          runOnUiThread { result.success(cacheFile.absolutePath) }
                                          return@Thread
                                      }
                                      val retriever = MediaMetadataRetriever()
                                      retriever.setDataSource(videoPath)
                                      val bitmap = retriever.getFrameAtTime(1000000, MediaMetadataRetriever.OPTION_CLOSEST_SYNC)
                                          ?: retriever.frameAtTime
                                      retriever.release()
                                      if (bitmap != null) {
                                          val fos = FileOutputStream(cacheFile)
                                          bitmap.compress(Bitmap.CompressFormat.JPEG, 70, fos)
                                          fos.flush()
                                          fos.close()
                                          runOnUiThread { result.success(cacheFile.absolutePath) }
                                      } else {
                                          runOnUiThread { result.success(null) }
                                      }
                                  } catch (e: Exception) {
                                      runOnUiThread { result.success(null) }
                                  }
                              }.start()
                          }
                          "setVolume" -> {
                              val vol = call.argument<Double>("volume") ?: 0.5
                              val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                              val maxVol = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                              val targetVol = (vol * maxVol).toInt().coerceIn(0, maxVol)
                              audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, targetVol, 0)
                              result.success(true)
                          }
                          "getVolume" -> {
                              val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                              val maxVol = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                              val curVol = audioManager.getStreamVolume(AudioManager.STREAM_MUSIC)
                              result.success(curVol.toDouble() / maxVol.toDouble())
                          }
                          "setBrightness" -> {
                              val brightness = (call.argument<Double>("brightness")?.toFloat() ?: 0.5f).coerceIn(0.01f, 1.0f)
                              activity?.let {
                                  val layout = it.window.attributes
                                  layout.screenBrightness = brightness
                                  it.window.attributes = layout
                              }
                              result.success(true)
                          }
                          "getBrightness" -> {
                              var b = activity?.window?.attributes?.screenBrightness ?: -1.0f
                              if (b < 0) {
                                  try {
                                      b = Settings.System.getInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS) / 255.0f
                                  } catch (e: Exception) {
                                      b = 0.5f
                                  }
                              }
                              result.success(b.toDouble())
                          }
                          else -> result.notImplemented()
                      }
                  }
              }
          }
          EOF

          # 2. Master Flutter UI (All Folders Scanner + Grid/List View + White Screen Fix)
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:media_kit/media_kit.dart';
          import 'package:media_kit_video/media_kit_video.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:path/path.dart' as p;
          import 'package:shared_preferences/shared_preferences.dart';

          const MethodChannel nativeChannel = MethodChannel('com.merish.player/native');

          final Map<String, Duration> resumeMemory = {};
          Set<String> hiddenFolders = {};

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            MediaKit.ensureInitialized();
            await SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
            runApp(const MerishPlayerApp());
          }

          class MerishPlayerApp extends StatelessWidget {
            const MerishPlayerApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Merish',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: Colors.black,
                  primaryColor: const Color(0xFFFFB300),
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFFFFB300),
                    surface: Color(0xFF0D0D0D),
                  ),
                ),
                home: const FolderBrowserScreen(),
              );
            }
          }

          // ===========================================================================
          // ALL-FOLDER SCANNER WITH GRID/LIST VIEW & HIDDEN MANAGER
          // ===========================================================================
          class FolderBrowserScreen extends StatefulWidget {
            const FolderBrowserScreen({super.key});

            @override
            State<FolderBrowserScreen> createState() => _FolderBrowserScreenState();
          }

          class _FolderBrowserScreenState extends State<FolderBrowserScreen> {
            bool isLoading = true;
            bool isGridView = false;
            String searchQuery = "";
            Map<String, List<File>> folderMap = {};
            final Map<String, String?> thumbnailCache = {};

            @override
            void initState() {
              super.initState();
              SystemChrome.setPreferredOrientations([
                DeviceOrientation.portraitUp,
                DeviceOrientation.landscapeLeft,
                DeviceOrientation.landscapeRight,
              ]);
              loadPrefsAndScan();
            }

            Future<void> loadPrefsAndScan() async {
              final prefs = await SharedPreferences.getInstance();
              final savedHidden = prefs.getStringList('hidden_folders') ?? [];
              isGridView = prefs.getBool('is_grid_view') ?? false;
              hiddenFolders = savedHidden.toSet();

              await requestAndDeepScan();
            }

            Future<void> saveHiddenFolders() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setStringList('hidden_folders', hiddenFolders.toList());
            }

            Future<void> toggleViewMode() async {
              setState(() => isGridView = !isGridView);
              final prefs = await SharedPreferences.getInstance();
              await prefs.setBool('is_grid_view', isGridView);
            }

            Future<void> requestAndDeepScan() async {
              setState(() => isLoading = true);

              var status = await Permission.manageExternalStorage.request();
              if (!status.isGranted) {
                await Permission.storage.request();
                await Permission.videos.request();
              }

              await runDeepScan();
            }

            // Scans ALL directories on device memory
            Future<void> runDeepScan() async {
              folderMap.clear();
              final videoExts = {'.mp4', '.mkv', '.webm', '.avi', '.mov', '.ts', '.flv', '.wmv', '.m4v'};
              final rootDir = Directory('/storage/emulated/0');

              if (await rootDir.exists()) {
                try {
                  final entities = rootDir.listSync(recursive: true, followLinks: false);
                  for (var entity in entities) {
                    if (entity is File) {
                      final pathLower = entity.path.toLowerCase();
                      if (pathLower.contains('/android/data') || pathLower.contains('/android/obb') || pathLower.contains('/.')) {
                        continue;
                      }
                      final ext = p.extension(entity.path).toLowerCase();
                      if (videoExts.contains(ext)) {
                        final parentDir = p.dirname(entity.path);
                        if (!hiddenFolders.contains(parentDir)) {
                          folderMap.putIfAbsent(parentDir, () => []).add(entity);
                        }
                      }
                    }
                  }
                } catch (_) {
                  // Fallback explicit directories
                  final directPaths = [
                    '/storage/emulated/0/DCIM/Camera',
                    '/storage/emulated/0/DCIM',
                    '/storage/emulated/0/Movies',
                    '/storage/emulated/0/Download',
                    '/storage/emulated/0/Download/Telegram',
                    '/storage/emulated/0/Telegram',
                    '/storage/emulated/0/WhatsApp/Media/WhatsApp Video',
                    '/storage/emulated/0/Android/media/com.whatsapp/WhatsApp/Media/WhatsApp Video',
                    '/storage/emulated/0/Pictures',
                    '/storage/emulated/0/Bluetooth',
                    '/storage/emulated/0/ShareMe',
                  ];

                  for (var dirPath in directPaths) {
                    final d = Directory(dirPath);
                    if (d.existsSync()) {
                      try {
                        for (var item in d.listSync(recursive: true)) {
                          if (item is File && videoExts.contains(p.extension(item.path).toLowerCase())) {
                            final parentDir = p.dirname(item.path);
                            if (!hiddenFolders.contains(parentDir)) {
                              folderMap.putIfAbsent(parentDir, () => []).add(item);
                            }
                          }
                        }
                      } catch (_) {}
                    }
                  }
                }
              }

              if (mounted) {
                setState(() => isLoading = false);
              }

              for (var fPath in folderMap.keys) {
                if (folderMap[fPath]!.isNotEmpty && !thumbnailCache.containsKey(fPath)) {
                  loadFolderThumb(folderMap[fPath]!.first.path, fPath);
                }
              }
            }

            Future<void> loadFolderThumb(String videoPath, String key) async {
              try {
                final String? thumb = await nativeChannel.invokeMethod('getThumbnail', {'path': videoPath});
                if (mounted && thumb != null) {
                  setState(() => thumbnailCache[key] = thumb);
                }
              } catch (_) {}
            }

            void hideFolder(String folderPath) {
              setState(() {
                hiddenFolders.add(folderPath);
                folderMap.remove(folderPath);
              });
              saveHiddenFolders();

              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  backgroundColor: const Color(0xFF141414),
                  content: Text("Hidden: ${p.basename(folderPath)}", style: const TextStyle(color: Colors.white)),
                  action: SnackBarAction(
                    label: "UNDO",
                    textColor: const Color(0xFFFFB300),
                    onPressed: () {
                      setState(() {
                        hiddenFolders.remove(folderPath);
                        runDeepScan();
                      });
                      saveHiddenFolders();
                    },
                  ),
                ),
              );
            }

            void showSettingsSheet() {
              showModalBottomSheet(
                context: context,
                backgroundColor: const Color(0xFF101010),
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(20))),
                builder: (context) {
                  return StatefulBuilder(builder: (ctx, setSheetState) {
                    return Padding(
                      padding: const EdgeInsets.all(22),
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            children: [
                              const Icon(Icons.settings_rounded, color: Color(0xFFFFB300)),
                              const SizedBox(width: 10),
                              const Text("Merish Studio Settings", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 18)),
                            ],
                          ),
                          const Divider(color: Colors.white12, height: 24),
                          ListTile(
                            contentPadding: EdgeInsets.zero,
                            leading: const Icon(Icons.visibility_off_rounded, color: Colors.white70),
                            title: const Text("Hidden Folders Manager", style: TextStyle(fontWeight: FontWeight.w600, fontSize: 14)),
                            subtitle: Text("${hiddenFolders.length} folders hidden", style: const TextStyle(color: Colors.white54, fontSize: 12)),
                            trailing: hiddenFolders.isNotEmpty
                                ? TextButton(
                                    onPressed: () {
                                      setState(() {
                                        hiddenFolders.clear();
                                        runDeepScan();
                                      });
                                      saveHiddenFolders();
                                      Navigator.pop(context);
                                    },
                                    child: const Text("RESTORE ALL", style: TextStyle(color: Color(0xFFFFB300), fontWeight: FontWeight.bold)),
                                  )
                                : null,
                          ),
                          ListTile(
                            contentPadding: EdgeInsets.zero,
                            leading: const Icon(Icons.memory_rounded, color: Colors.white70),
                            title: const Text("VPU Hardware Decoder", style: TextStyle(fontWeight: FontWeight.w600, fontSize: 14)),
                            subtitle: const Text("Direct Snapdragon MediaCodec surface pipeline", style: TextStyle(color: Colors.white54, fontSize: 12)),
                            trailing: const Text("AUTO (HW)", style: TextStyle(color: Color(0xFFFFB300), fontWeight: FontWeight.bold, fontSize: 12)),
                          ),
                        ],
                      ),
                    );
                  });
                },
              );
            }

            @override
            Widget build(BuildContext context) {
              final displayedFolders = folderMap.keys.where((k) {
                final name = p.basename(k).toLowerCase();
                return name.contains(searchQuery.toLowerCase());
              }).toList();

              return Scaffold(
                backgroundColor: Colors.black,
                appBar: AppBar(
                  backgroundColor: Colors.black,
                  elevation: 0,
                  title: Row(
                    children: [
                      Container(
                        padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                        decoration: BoxDecoration(
                          color: const Color(0xFFFFB300),
                          borderRadius: BorderRadius.circular(4),
                        ),
                        child: const Text(
                          "MERISH",
                          style: TextStyle(
                            color: Colors.black,
                            fontWeight: FontWeight.w900,
                            letterSpacing: 2,
                            fontSize: 13,
                          ),
                        ),
                      ),
                      const SizedBox(width: 14),
                      Text(
                        "${displayedFolders.length} Folders",
                        style: const TextStyle(fontSize: 16, fontWeight: FontWeight.w600, letterSpacing: 0.3),
                      ),
                    ],
                  ),
                  actions: [
                    IconButton(
                      icon: Icon(isGridView ? Icons.view_list_rounded : Icons.grid_view_rounded, color: Colors.white70),
                      onPressed: toggleViewMode,
                    ),
                    IconButton(
                      icon: const Icon(Icons.settings_outlined, color: Colors.white70),
                      onPressed: showSettingsSheet,
                    ),
                    IconButton(
                      icon: const Icon(Icons.refresh_rounded, color: Color(0xFFFFB300)),
                      onPressed: requestAndDeepScan,
                    ),
                  ],
                ),
                body: isLoading
                    ? const Center(
                        child: CircularProgressIndicator(color: Color(0xFFFFB300), strokeWidth: 2),
                      )
                    : displayedFolders.isEmpty
                        ? Center(
                            child: Padding(
                              padding: const EdgeInsets.all(28),
                              child: Column(
                                mainAxisAlignment: MainAxisAlignment.center,
                                children: [
                                  const Icon(Icons.folder_open_rounded, size: 68, color: Colors.white24),
                                  const SizedBox(height: 18),
                                  const Text("Storage Access Required", style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.white)),
                                  const SizedBox(height: 8),
                                  const Text(
                                    "Tap below to grant 'All Files Access' so Merish can index every folder on your device.",
                                    textAlign: TextAlign.center,
                                    style: TextStyle(color: Colors.white54, fontSize: 13),
                                  ),
                                  const SizedBox(height: 24),
                                  ElevatedButton.icon(
                                    style: ElevatedButton.styleFrom(
                                      backgroundColor: const Color(0xFFFFB300),
                                      foregroundColor: Colors.black,
                                      padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 12),
                                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(24)),
                                    ),
                                    onPressed: () async {
                                      await Permission.manageExternalStorage.request();
                                      requestAndDeepScan();
                                    },
                                    icon: const Icon(Icons.lock_open_rounded),
                                    label: const Text("Grant All Files Access", style: TextStyle(fontWeight: FontWeight.bold)),
                                  ),
                                ],
                              ),
                            ),
                          )
                        : isGridView
                            // 2-Column Luxury Grid View
                            ? GridView.builder(
                                padding: const EdgeInsets.all(14),
                                gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                                  crossAxisCount: 2,
                                  crossAxisSpacing: 12,
                                  mainAxisSpacing: 12,
                                  childAspectRatio: 0.95,
                                ),
                                itemCount: displayedFolders.length,
                                itemBuilder: (context, index) {
                                  final folderPath = displayedFolders[index];
                                  final folderName = p.basename(folderPath);
                                  final files = folderMap[folderPath]!;
                                  final thumb = thumbnailCache[folderPath];

                                  return InkWell(
                                    borderRadius: BorderRadius.circular(14),
                                    onLongPress: () => hideFolder(folderPath),
                                    onTap: () {
                                      Navigator.push(
                                        context,
                                        MaterialPageRoute(
                                          builder: (_) => VideoListScreen(folderName: folderName, files: files),
                                        ),
                                      );
                                    },
                                    child: Container(
                                      decoration: BoxDecoration(
                                        color: const Color(0xFF0F0F0F),
                                        borderRadius: BorderRadius.circular(14),
                                        border: Border.all(color: Colors.white.withOpacity(0.08)),
                                      ),
                                      child: Column(
                                        crossAxisAlignment: CrossAxisAlignment.start,
                                        children: [
                                          Expanded(
                                            child: ClipRRect(
                                              borderRadius: const BorderRadius.vertical(top: Radius.circular(14)),
                                              child: Container(
                                                width: double.infinity,
                                                color: Colors.black,
                                                child: thumb != null && File(thumb).existsSync()
                                                    ? Image.file(File(thumb), fit: BoxFit.cover)
                                                    : const Icon(Icons.folder_rounded, color: Color(0xFFFFB300), size: 40),
                                              ),
                                            ),
                                          ),
                                          Padding(
                                            padding: const EdgeInsets.all(10),
                                            child: Row(
                                              children: [
                                                Expanded(
                                                  child: Column(
                                                    crossAxisAlignment: CrossAxisAlignment.start,
                                                    children: [
                                                      Text(
                                                        folderName,
                                                        style: const TextStyle(fontWeight: FontWeight.w600, fontSize: 13),
                                                        maxLines: 1,
                                                        overflow: TextOverflow.ellipsis,
                                                      ),
                                                      const SizedBox(height: 2),
                                                      Text(
                                                        "${files.length} Videos",
                                                        style: const TextStyle(color: Colors.white54, fontSize: 11),
                                                      ),
                                                    ],
                                                  ),
                                                ),
                                                PopupMenuButton<String>(
                                                  color: const Color(0xFF161616),
                                                  padding: EdgeInsets.zero,
                                                  icon: const Icon(Icons.more_vert_rounded, color: Colors.white38, size: 18),
                                                  onSelected: (val) {
                                                    if (val == 'hide') hideFolder(folderPath);
                                                  },
                                                  itemBuilder: (ctx) => [
                                                    const PopupMenuItem(
                                                      value: 'hide',
                                                      child: Text("Hide Folder", style: TextStyle(color: Colors.white, fontSize: 13)),
                                                    ),
                                                  ],
                                                ),
                                              ],
                                            ),
                                          ),
                                        ],
                                      ),
                                    ),
                                  );
                                },
                              )
                            // Clean List View
                            : ListView.separated(
                                padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 12),
                                itemCount: displayedFolders.length,
                                separatorBuilder: (_, __) => const SizedBox(height: 12),
                                itemBuilder: (context, index) {
                                  final folderPath = displayedFolders[index];
                                  final folderName = p.basename(folderPath);
                                  final files = folderMap[folderPath]!;
                                  final thumb = thumbnailCache[folderPath];

                                  return InkWell(
                                    borderRadius: BorderRadius.circular(14),
                                    onLongPress: () => hideFolder(folderPath),
                                    onTap: () {
                                      Navigator.push(
                                        context,
                                        MaterialPageRoute(
                                          builder: (_) => VideoListScreen(folderName: folderName, files: files),
                                        ),
                                      );
                                    },
                                    child: Container(
                                      padding: const EdgeInsets.all(12),
                                      decoration: BoxDecoration(
                                        color: const Color(0xFF0F0F0F),
                                        borderRadius: BorderRadius.circular(14),
                                        border: Border.all(color: Colors.white.withOpacity(0.07)),
                                      ),
                                      child: Row(
                                        children: [
                                          ClipRRect(
                                            borderRadius: BorderRadius.circular(10),
                                            child: Container(
                                              width: 65,
                                              height: 65,
                                              color: Colors.black,
                                              child: thumb != null && File(thumb).existsSync()
                                                  ? Image.file(File(thumb), fit: BoxFit.cover)
                                                  : const Icon(Icons.folder_rounded, color: Color(0xFFFFB300), size: 30),
                                            ),
                                          ),
                                          const SizedBox(width: 16),
                                          Expanded(
                                            child: Column(
                                              crossAxisAlignment: CrossAxisAlignment.start,
                                              children: [
                                                Text(
                                                  folderName,
                                                  style: const TextStyle(fontWeight: FontWeight.w600, fontSize: 15),
                                                  maxLines: 1,
                                                  overflow: TextOverflow.ellipsis,
                                                ),
                                                const SizedBox(height: 4),
                                                Text(
                                                  "${files.length} Videos • $folderPath",
                                                  style: const TextStyle(color: Colors.white54, fontSize: 11),
                                                  maxLines: 1,
                                                  overflow: TextOverflow.ellipsis,
                                                ),
                                              ],
                                            ),
                                          ),
                                          PopupMenuButton<String>(
                                            color: const Color(0xFF161616),
                                            icon: const Icon(Icons.more_vert_rounded, color: Colors.white38, size: 20),
                                            onSelected: (val) {
                                              if (val == 'hide') hideFolder(folderPath);
                                            },
                                            itemBuilder: (ctx) => [
                                              const PopupMenuItem(
                                                value: 'hide',
                                                child: Text("Hide Folder", style: TextStyle(color: Colors.white, fontSize: 13)),
                                              ),
                                            ],
                                          ),
                                        ],
                                      ),
                                    ),
                                  );
                                },
                              ),
              );
            }
          }

          // ===========================================================================
          // VIDEO LIST SCREEN
          // ===========================================================================
          class VideoListScreen extends StatefulWidget {
            final String folderName;
            final List<File> files;

            const VideoListScreen({super.key, required this.folderName, required this.files});

            @override
            State<VideoListScreen> createState() => _VideoListScreenState();
          }

          class _VideoListScreenState extends State<VideoListScreen> {
            final Map<String, String?> videoThumbs = {};

            @override
            void initState() {
              super.initState();
              for (var f in widget.files) {
                loadThumb(f.path);
              }
            }

            Future<void> loadThumb(String videoPath) async {
              try {
                final String? thumb = await nativeChannel.invokeMethod('getThumbnail', {'path': videoPath});
                if (mounted && thumb != null) {
                  setState(() => videoThumbs[videoPath] = thumb);
                }
              } catch (_) {}
            }

            String formatSize(File f) {
              try {
                int bytes = f.lengthSync();
                if (bytes >= 1024 * 1024 * 1024) {
                  return "${(bytes / (1024 * 1024 * 1024)).toStringAsFixed(2)} GB";
                }
                return "${(bytes / (1024 * 1024)).toStringAsFixed(1)} MB";
              } catch (_) {
                return "--";
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                appBar: AppBar(
                  backgroundColor: Colors.black,
                  elevation: 0,
                  title: Text(widget.folderName, style: const TextStyle(fontWeight: FontWeight.w600)),
                ),
                body: ListView.separated(
                  padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                  itemCount: widget.files.length,
                  separatorBuilder: (_, __) => const SizedBox(height: 10),
                  itemBuilder: (context, i) {
                    final file = widget.files[i];
                    final name = p.basename(file.path);
                    final ext = p.extension(file.path).toUpperCase().replaceAll('.', '');
                    final size = formatSize(file);
                    final thumbPath = videoThumbs[file.path];

                    return InkWell(
                      borderRadius: BorderRadius.circular(12),
                      onTap: () {
                        Navigator.push(
                          context,
                          MaterialPageRoute(
                            builder: (_) => MasterPlayerScreen(
                              playlist: widget.files,
                              currentIndex: i,
                            ),
                          ),
                        );
