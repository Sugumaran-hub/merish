name: Build Merish Engine APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Merish Engine
        run: |
          # 1. Fresh pure Android Flutter project
          rm -rf /tmp/merish_app
          flutter create --platforms=android --org com.merish.player --project-name merish /tmp/merish_app
          cd /tmp/merish_app

          # 2. Add dependencies cleanly
          flutter pub add media_kit
          flutter pub add media_kit_video
          flutter pub add media_kit_libs_android_video
          flutter pub add permission_handler
          flutter pub add image_picker

          # 3. Inject AMOLED Player with Native Gallery Video Picker
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:media_kit/media_kit.dart';
          import 'package:media_kit_video/media_kit_video.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:image_picker/image_picker.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            MediaKit.ensureInitialized();
            await SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
            runApp(const MerishPlayerApp());
          }

          class MerishPlayerApp extends StatelessWidget {
            const MerishPlayerApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Merish',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: Colors.black,
                  colorScheme: const ColorScheme.dark(
                    primary: Colors.amber,
                    surface: Colors.black,
                  ),
                ),
                home: const VideoPlayerScreen(),
              );
            }
          }

          class VideoPlayerScreen extends StatefulWidget {
            const VideoPlayerScreen({super.key});

            @override
            State<VideoPlayerScreen> createState() => _VideoPlayerScreenState();
          }

          class _VideoPlayerScreenState extends State<VideoPlayerScreen> {
            late final Player player;
            late final VideoController controller;
            final ImagePicker _picker = ImagePicker();
            bool isFileLoaded = false;

            @override
            void initState() {
              super.initState();
              initEngine();
            }

            void initEngine() {
              player = Player(
                configuration: const PlayerConfiguration(
                  bufferSize: 32 * 1024 * 1024,
                ),
              );

              controller = VideoController(
                player,
                configuration: const VideoControllerConfiguration(
                  enableHardwareAcceleration: true,
                  hwdec: 'mediacodec',
                ),
              );
            }

            Future<void> pickAndPlayVideo() async {
              await Permission.storage.request();
              await Permission.videos.request();

              final XFile? video = await _picker.pickVideo(source: ImageSource.gallery);

              if (video != null) {
                await player.open(Media(video.path));
                if (mounted) {
                  setState(() {
                    isFileLoaded = true;
                  });
                }
              }
            }

            @override
            void dispose() {
              player.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                body: Stack(
                  children: [
                    Center(
                      child: isFileLoaded
                          ? Video(
                              controller: controller,
                              controls: AdaptiveVideoControls,
                            )
                          : Column(
                              mainAxisAlignment: MainAxisAlignment.center,
                              children: [
                                Container(
                                  width: 80,
                                  height: 80,
                                  decoration: BoxDecoration(
                                    shape: BoxShape.circle,
                                    border: Border.all(color: Colors.amber, width: 2),
                                  ),
                                  child: const Icon(
                                    Icons.play_arrow_rounded,
                                    size: 50,
                                    color: Colors.amber,
                                  ),
                                ),
                                const SizedBox(height: 24),
                                const Text(
                                  "Merish",
                                  style: TextStyle(
                                    color: Colors.white,
                                    fontSize: 28,
                                    fontWeight: FontWeight.bold,
                                    letterSpacing: 1.5,
                                  ),
                                ),
                                const SizedBox(height: 8),
                                const Text(
                                  "Snapdragon Hardware Accelerated Engine",
                                  style: TextStyle(
                                    color: Colors.white54,
                                    fontSize: 13,
                                  ),
                                ),
                                const SizedBox(height: 32),
                                ElevatedButton.icon(
                                  style: ElevatedButton.styleFrom(
                                    backgroundColor: Colors.amber,
                                    foregroundColor: Colors.black,
                                    padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 14),
                                    shape: RoundedRectangleBorder(
                                      borderRadius: BorderRadius.circular(28),
                                    ),
                                  ),
                                  onPressed: pickAndPlayVideo,
                                  icon: const Icon(Icons.video_library_rounded),
                                  label: const Text(
                                    "Open Video File",
                                    style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16),
                                  ),
                                ),
                              ],
                            ),
                    ),
                    if (isFileLoaded)
                      Positioned(
                        top: 24,
                        left: 16,
                        child: IconButton(
                          icon: const Icon(Icons.arrow_back, color: Colors.white),
                          onPressed: () {
                            player.stop();
                            setState(() {
                              isFileLoaded = false;
                            });
                          },
                        ),
                      ),
                  ],
                ),
              );
            }
          }
          EOF

          # 4. Set App Display Name to "Merish"
          sed -i 's/android:label="merish"/android:label="Merish"/g' android/app/src/main/AndroidManifest.xml

          # 5. Generate Minimalist Cinema App Icon
          python3 -c "
          import os
          import struct
          import zlib

          def make_png(width, height):
              raw_data = bytearray()
              cx, cy, r = width // 2, height // 2, width // 2 - 8
              for y in range(height):
                  raw_data.append(0)
                  for x in range(width):
                      dx = x - cx
                      dy = y - cy
                      dist_sq = dx*dx + dy*dy
                      if dist_sq <= r*r:
                          if x >= cx - 12 and x <= cx + 24 and abs(dy) <= (x - (cx - 12)) * 0.8:
                              raw_data.extend([255, 191, 0, 255])
                          else:
                              raw_data.extend([10, 10, 10, 255])
                      else:
                          raw_data.extend([0, 0, 0, 0])
              
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)

              header = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0))
              idat = chunk(b'IDAT', zlib.compress(bytes(raw_data)))
              iend = chunk(b'IEND', b'')
              return header + ihdr + idat + iend

          png_bytes = make_png(192, 192)
          res_dir = 'android/app/src/main/res'
          for d in os.listdir(res_dir):
              if d.startswith('mipmap'):
                  with open(os.path.join(res_dir, d, 'ic_launcher.png'), 'wb') as f:
                      f.write(png_bytes)
          "

          # 6. Apply SDK 37 & MinSDK 21 rules
          find android/app -name "build.gradle*" -exec sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 37/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' {} +

          # 7. Build Snapdragon ARM64 APK
          flutter build apk --split-per-abi --release

          # 8. Copy output APK
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk $GITHUB_WORKSPACE/output/merish-arm64-v8a.apk

      - name: Upload Merish APK
        uses: actions/upload-artifact@v4
        with:
          name: Merish-Engine-ARM64
          path: output/merish-arm64-v8a.apk
